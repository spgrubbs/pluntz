<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05060f" />
    <title>Pluntz</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060f;
        font-family: 'Courier New', ui-monospace, monospace;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #b8c4d8;
      }
      #ui > * {
        pointer-events: auto;
      }
      .panel {
        position: absolute;
        top: max(8px, env(safe-area-inset-top));
        left: 8px;
        background: rgba(8, 12, 24, 0.82);
        border: 1px solid #2a3550;
        border-radius: 8px;
        font-size: 12px;
        min-width: 210px;
        overflow: hidden;
      }
      .panel-head {
        padding: 7px 10px;
        font-weight: bold;
        letter-spacing: 1px;
        color: #7fe8b0;
        cursor: pointer;
      }
      .panel-body {
        padding: 4px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .panel-body.hidden {
        display: none;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: #8fa0bd;
      }
      .stat-row b {
        color: #dce6f5;
        font-weight: normal;
      }
      .btn-row {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      button {
        font-family: inherit;
        font-size: 12px;
        background: #182238;
        color: #b8c4d8;
        border: 1px solid #2f3d5e;
        border-radius: 5px;
        padding: 5px 9px;
        cursor: pointer;
      }
      button.active {
        background: #2b5c46;
        color: #aef5cf;
        border-color: #3f8a67;
      }
      .roundchip {
        position: absolute;
        top: max(8px, env(safe-area-inset-top));
        right: 8px;
        background: rgba(8, 12, 24, 0.82);
        border: 1px solid #2a3550;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 11px;
        color: #b8c4d8;
        max-width: 46vw;
        text-align: right;
      }
      .banner {
        position: absolute;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%);
        background: rgba(6, 9, 18, 0.94);
        border: 1px solid #2a3550;
        border-radius: 14px;
        padding: 22px 30px;
        text-align: center;
        display: none;
        max-width: min(420px, calc(100vw - 40px));
      }
      .banner.open {
        display: block;
      }
      .banner h1 {
        margin: 0 0 10px;
        font-size: 26px;
        letter-spacing: 4px;
      }
      .banner h1.win {
        color: #7fe8b0;
        text-shadow: 0 0 18px rgba(127, 232, 176, 0.5);
      }
      .banner h1.loss {
        color: #f28a7a;
        text-shadow: 0 0 18px rgba(242, 138, 122, 0.4);
      }
      .banner p {
        color: #8fa0bd;
        line-height: 1.5;
        margin: 0 0 14px;
      }
      .banner .btn-row {
        justify-content: center;
      }
      .actionbar {
        position: absolute;
        right: 10px;
        bottom: max(14px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .actionbar button {
        font-size: 14px;
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(24, 34, 56, 0.9);
      }
      .actionbar button.active {
        background: #6b3f2b;
        color: #ffc9a8;
        border-color: #a05c3a;
      }
      label.chk {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #8fa0bd;
      }
      input[type='range'] {
        width: 100%;
      }
      #inspector {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: max(10px, env(safe-area-inset-bottom));
        background: rgba(8, 12, 24, 0.88);
        border: 1px solid #2a3550;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12px;
        min-width: 265px;
        max-width: min(360px, calc(100vw - 20px));
        max-height: 55vh;
        overflow-y: auto;
        display: none;
      }
      .aim {
        color: #ffd257;
        margin: 0 0 7px;
      }
      .aim.warn {
        color: #f28a7a;
      }
      #inspector details {
        margin-top: 7px;
        border-top: 1px solid #223052;
        padding-top: 7px;
      }
      #inspector summary {
        cursor: pointer;
        color: #7fa0d8;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .desc {
        color: #8fa0bd;
        margin: 7px 0;
        line-height: 1.5;
      }
      ol.prio {
        margin: 4px 0 8px;
        padding-left: 18px;
        color: #56637f;
      }
      ol.prio li {
        margin: 3px 0;
      }
      ol.prio li.active {
        color: #aef5cf;
      }
      #inspector.open {
        display: block;
      }
      #inspector h3 {
        margin: 0 0 6px;
        font-size: 13px;
        color: #7fe8b0;
        letter-spacing: 1px;
      }
      .bar {
        height: 6px;
        background: #1a2438;
        border-radius: 3px;
        overflow: hidden;
        margin: 4px 0 8px;
      }
      .bar > div {
        height: 100%;
        background: linear-gradient(90deg, #2fbf7f, #7fe8b0);
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="inspector"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
